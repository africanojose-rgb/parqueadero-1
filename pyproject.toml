[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciudad-de-burgos"
version = "3.3.0"
description = "Sistema de gestión de parqueadero Ciudad de Burgos"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["domain", "infrastructure", "services", "ui", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
